# Stable High-Performance Nginx Proxy configuration file
# This setup handles static client files, API routing, and the 'dl.' download proxy subdomain

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimal caching and performance adjustments
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Hide Nginx software version details for extra system security
    server_tokens off;

    # Streaming and buffering configurations for high speed large files
    client_max_body_size 500M;
    client_body_buffer_size 1M;
    proxy_max_temp_file_size 0; # Set to 0 to disable writing chunks to disk, optimizing download speeds
    proxy_buffering off; # Immediately stream file chunks to the user without locking server memory

    # --- SERVER BLOCK 1: 'dl.example.com' ---
    # Intercepts raw file download downloads from GitHub releases
    server {
        listen 80;
        listen [::]:80;
        server_name dl.example.com dl.*; # Target subdomain match

        # Global CORS policies for downloader requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Authorization' always;

        location / {
            # Support OPTIONS health/cors prefight
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Intercept download query and stream proxy to githubusercontent s3
            # Usage scenario: http://dl.example.com/dl?url=https://github.com/owner/repo/releases/download/...
            if ($arg_url ~* "^https?://([^/]+)(.*)$") {
                set $target_host $1;
                set $target_path $2;
            }

            # Fallback block if arg_url is missing
            if ($target_host = "") {
                return 400 "Error: Missing or invalid 'url' query parameter. Usage: http://dl.example.com/?url=https://github.com/owner/repo/releases/download/...";
            }

            resolver 1.1.1.1 8.8.8.8 valid=300s;
            resolver_timeout 5s;

            # Rewrite download headers to prevent CORS errors on arbitrary devices
            proxy_set_header Host $target_host;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            # Remove cookies so GitHub rate-limits do not leak
            proxy_set_header Cookie "";
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Content-Disposition';

            # Force browsers to trigger save file popup
            add_header Content-Disposition 'attachment' always;
            add_header 'Access-Control-Allow-Origin' '*' always;

            # Dynamic proxy pass to target url payload
            proxy_pass https://$target_host$target_path$is_args$args;
            proxy_ssl_server_name on;
            proxy_ssl_name $target_host;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }
    }

    # --- SERVER BLOCK 2: 'example.com' ---
    # Standard static host serving compiled Vite frontend and Express server
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        # Frontend location (or Node.js bundle entry point)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Node Express proxy API logic block
        location /api/ {
            proxy_pass http://127.0.0.1:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
